<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국 고대 미술사 (철기·원삼국 & 백제) 퀴즈</title>
    <style>
        :root {
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            --accent-color: #007AFF;
            --accent-light: #E5F1FF;
            --correct-color: #34C759;
            --correct-bg: #E8F8EC;
            --wrong-color: #FF3B30;
            --wrong-bg: #FEECEB;
            --border-color: #E5E5EA;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* 상단 헤더 */
        .site-header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 24px 0 18px 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-inner {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 4px;
        }

        .header-sub {
            font-size: 24px;
            font-weight: 700;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            border-radius: 3px;
            margin-top: 14px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--accent-color);
            transition: width 0.3s ease;
            border-radius: 3px;
        }

        /* 본문 */
        .content-area {
            max-width: 860px;
            margin: 0 auto;
            padding: 36px 24px 60px 24px;
        }

        /* 시작 화면 */
        .intro-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 48px 40px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 640px;
            margin: 40px auto 0 auto;
        }

        .intro-icon {
            font-size: 56px;
            margin-bottom: 18px;
        }

        .intro-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .intro-desc {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 32px;
        }

        .badge {
            background: var(--bg-color);
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            padding: 7px 14px;
            border-radius: 20px;
        }

        /* 문제 영역 */
        .q-counter {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .q-text {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.5;
            background-color: var(--card-bg);
            padding: 28px 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .options-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 24px;
        }

        @media (max-width: 680px) {
            .options-list { grid-template-columns: 1fr; }
        }

        .option-btn {
            background-color: var(--card-bg);
            border: 2px solid transparent;
            border-radius: var(--radius);
            padding: 18px 20px;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            text-align: left;
            cursor: pointer;
            transition: border-color 0.15s ease, background-color 0.15s ease;
            box-shadow: var(--shadow);
            line-height: 1.45;
        }

        .option-btn:hover:not(.disabled) {
            border-color: var(--accent-color);
        }

        .option-btn:focus-visible {
            outline: 3px solid var(--accent-light);
            outline-offset: 2px;
        }

        .option-btn.selected {
            border-color: var(--accent-color);
            background-color: var(--accent-light);
            color: var(--accent-color);
        }

        .option-btn.correct {
            border-color: var(--correct-color);
            background-color: var(--correct-bg);
            color: var(--correct-color);
            font-weight: 700;
        }

        .option-btn.wrong {
            border-color: var(--wrong-color);
            background-color: var(--wrong-bg);
            color: var(--wrong-color);
        }

        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.85;
        }

        /* 해설 박스 */
        .rationale-box {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 24px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            display: none;
            border-left: 4px solid var(--accent-color);
            animation: fadeIn 0.3s ease;
        }

        .rationale-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--accent-color);
        }

        .rationale-text {
            font-size: 15px;
            line-height: 1.6;
        }

        /* 메인 버튼 */
        .btn-primary {
            display: block;
            margin: 0 auto;
            min-width: 280px;
            height: 52px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 26px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s ease;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
            padding: 0 36px;
        }

        .btn-primary:hover:not(:disabled) {
            opacity: 0.9;
        }

        .btn-primary:disabled {
            background-color: #C7C7CC;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* 결과 화면 */
        .result-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 36px 32px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 560px;
            margin: 0 auto 32px auto;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 70px;
            background: conic-gradient(var(--accent-color) 0deg, var(--border-color) 0deg);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 22px auto;
        }

        .score-circle-inner {
            width: 116px;
            height: 116px;
            border-radius: 58px;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .score-number {
            font-size: 34px;
            font-weight: 800;
            color: var(--accent-color);
        }

        .score-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .result-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .result-msg {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .review-title {
            font-size: 18px;
            font-weight: 700;
            margin: 28px 0 14px 4px;
        }

        .review-item {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
        }

        .review-q {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.45;
        }

        .review-ans {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .review-ans.user-wrong {
            color: var(--wrong-color);
            text-decoration: line-through;
        }

        .review-ans.correct-is {
            color: var(--correct-color);
            font-weight: 600;
        }

        .review-exp {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 상단 헤더 -->
    <header class="site-header">
        <div class="header-inner">
            <div class="header-title">미술사 실력 검정</div>
            <div class="header-sub" id="headerSubTitle">철기·원삼국 & 백제 미술</div>
            <div class="progress-bar-container hidden" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="content-area">

        <!-- 1. 시작 화면 -->
        <div id="startScreen">
            <div class="intro-card">
                <div class="intro-icon">🏺</div>
                <h1 class="intro-title">한국 고대 미술사 학습 퀴즈</h1>
                <p class="intro-desc">제공된 강의 자료 3편의 핵심 내용을 다루는 10개의 엄선된 객관식 문제풀이입니다.</p>
                <div class="badge-container">
                    <span class="badge">철기·원삼국 시대</span>
                    <span class="badge">한성·웅진·사비 백제</span>
                    <span class="badge">무령왕릉 & 금동대향로</span>
                    <span class="badge">백제 불교 미술</span>
                </div>
                <button class="btn-primary" id="startBtn">퀴즈 시작하기</button>
            </div>
        </div>

        <!-- 2. 퀴즈 진행 화면 -->
        <div id="quizScreen" class="hidden">
            <div class="q-counter" id="qCounter">문제 1 / 10</div>
            <div class="q-text" id="qText">문제 텍스트가 들어갑니다.</div>
            <div class="options-list" id="optionsList"></div>
            <div class="rationale-box" id="rationaleBox">
                <div class="rationale-title" id="rationaleTitle">정답 해설</div>
                <div class="rationale-text" id="rationaleText">해설 내용이 들어갑니다.</div>
            </div>
            <button class="btn-primary" id="quizBtn" disabled>정답 확인하기</button>
        </div>

        <!-- 3. 결과 화면 -->
        <div id="resultScreen" class="hidden">
            <div class="result-card">
                <div class="score-circle" id="scoreCircle">
                    <div class="score-circle-inner">
                        <div class="score-number" id="scoreNum">0</div>
                        <div class="score-label">100점 만점</div>
                    </div>
                </div>
                <h2 class="result-title" id="resultTitle">수고하셨습니다!</h2>
                <p class="result-msg" id="resultMsg">결과 분석 메시지가 표시됩니다.</p>
            </div>

            <div class="review-title">📝 오답 노트 및 해설</div>
            <div id="reviewList"></div>

            <button class="btn-primary" id="restartBtn" style="margin-top: 24px;">다시 풀기</button>
        </div>

    </main>

<script>
    const quizData = [
        {
            question: "창원 다호리 1호분에서 출토되었으며, 2,100년 전 한반도 남부에서 이미 문자를 사용하고 문서 작성을 행했음을 입증하는 대표적인 유물은?",
            options: [
                "붓과 지우개 칼(서도)",

            options: [

            options: [

        },
        {
            question: "삼국사기와 백제의 미학을 상징하는 대표적 표현으로, '검소하지만 누추하지 않고, 화려하지만 사치스럽지 않다'라는 의미의 한자 성어는?",
            options: [
                "검이불루 화이불치 (儉而不陋 華而不侈)",

            question: "1971년 공주 송산리 고분군에서 발견된 '무령왕릉'에 대한 설명으로 올바르지 않은 것은?",

            ],
            answer: 2,
            rationale: "무령왕과 왕비의 관재(목관 나무)는 신라산이 아니라, 일본 남부/고야산 일대 특산종인 '금송(金松)'으로 제작되어 백제와 일본의 긴밀한 교류를 증명합니다."

        },
        {

            options: [
                "목탑 요소를 단순 모방하던 단계를 벗어나 석탑만의 독자적 미학을 완성했다.",

            ],
            answer: 0,
            rationale: "미륵사지 석탑이 목탑을 석재로 재현하는 과도기적 단계였다면, 정림사지 오층석탑은 세련된 비례와 정제된 구조로 백제 석탑 고유의 독자적 미학을 완성했습니다."
        },
        {
            question: "부여 능산리 사지에서 출토된 '백제 금동대향로(국보 287호)'에 관한 설명으로 옳지 않은 것은?",
            options: [
                "꼭지에는 봉황이 있고, 뚜껑에는 5명의 악사와 산봉우리가 표현되어 있다.",
                "향로 몸체는 활짝 핀 연꽃 모양으로 불교적 상징성을 띤다.",
                "제작 과정에서 밀랍주조법과 수은아말감 도금법이 활용되었다.",
                "중국의 박산향로 형태를 오차 없이 동일하게 베껴 백제의 독창성이 없다."
            ],
            answer: 3,
            rationale: "백제 금동대향로는 중국 박산향로의 산악 모티프를 불교의 연꽃 화염 구조로 독창적으로 변형하고, 도교적 신선 세계와 불교적 정토관을 조화롭게 융합한 백제 최고 걸작입니다."
        }
    ];

    let currentIdx = 0;
    let selectedOption = null;
    let userAnswers = new Array(quizData.length).fill(null);
    let isEvaluated = false;

    const headerSubTitle = document.getElementById('headerSubTitle');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');

    const startScreen = document.getElementById('startScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');

    const qCounter = document.getElementById('qCounter');
    const qText = document.getElementById('qText');
    const optionsList = document.getElementById('optionsList');
    const rationaleBox = document.getElementById('rationaleBox');
    const rationaleTitle = document.getElementById('rationaleTitle');
    const rationaleText = document.getElementById('rationaleText');

    const scoreCircle = document.getElementById('scoreCircle');
    const scoreNum = document.getElementById('scoreNum');
    const resultTitle = document.getElementById('resultTitle');
    const resultMsg = document.getElementById('resultMsg');
    const reviewList = document.getElementById('reviewList');

    const startBtn = document.getElementById('startBtn');
    const quizBtn = document.getElementById('quizBtn');
    const restartBtn = document.getElementById('restartBtn');

    startBtn.addEventListener('click', startQuiz);
    restartBtn.addEventListener('click', restartQuiz);
    quizBtn.addEventListener('click', () => {
        if (!isEvaluated) {
            evaluateCurrentQuestion();
        } else {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion(currentIdx);
            } else {
                showResults();
            }
        }
    });

    function startQuiz() {
        startScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        progressContainer.classList.remove('hidden');

        currentIdx = 0;
        userAnswers.fill(null);
        loadQuestion(currentIdx);
        window.scrollTo(0, 0);
    }

    function loadQuestion(idx) {
        selectedOption = null;
        isEvaluated = false;

        const progress = ((idx + 1) / quizData.length) * 100;
        progressBar.style.width = `${progress}%`;

        qCounter.textContent = `문제 ${idx + 1} / ${quizData.length}`;
        qText.textContent = quizData[idx].question;

        optionsList.innerHTML = '';
        quizData[idx].options.forEach((optText, optIdx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span style="margin-right:8px; opacity:0.6; font-weight:700;">${optIdx + 1}.</span> ${optText}`;
            btn.addEventListener('click', () => selectOption(optIdx, btn));
            optionsList.appendChild(btn);
        });

        rationaleBox.style.display = 'none';
        quizBtn.textContent = '정답 확인하기';
        quizBtn.disabled = true;
        window.scrollTo(0, 0);
    }

    function selectOption(optIdx, btnElement) {
        if (isEvaluated) return;

        selectedOption = optIdx;

        const buttons = optionsList.querySelectorAll('.option-btn');
        buttons.forEach(b => b.classList.remove('selected'));
        btnElement.classList.add('selected');

        quizBtn.disabled = false;
    }

    function evaluateCurrentQuestion() {
        if (selectedOption === null) return;

        isEvaluated = true;
        userAnswers[currentIdx] = selectedOption;

        const currentQ = quizData[currentIdx];
        const isCorrect = (selectedOption === currentQ.answer);
        const buttons = optionsList.querySelectorAll('.option-btn');

        buttons.forEach((btn, optIdx) => {
            btn.classList.add('disabled');
            btn.classList.remove('selected');

            if (optIdx === currentQ.answer) {
                btn.classList.add('correct');
            } else if (optIdx === selectedOption && !isCorrect) {
                btn.classList.add('wrong');
            }
        });

        rationaleTitle.textContent = isCorrect ? '🎉 정답입니다!' : '❌ 오답입니다';
        rationaleTitle.style.color = isCorrect ? 'var(--correct-color)' : 'var(--wrong-color)';
        rationaleText.textContent = currentQ.rationale;
        rationaleBox.style.display = 'block';

        quizBtn.textContent = (currentIdx < quizData.length - 1) ? '다음 문제로' : '최종 결과 보기';
    }

    function showResults() {
        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        headerSubTitle.textContent = '퀴즈 결과 리포트';

        let correctCount = 0;
        userAnswers.forEach((ans, idx) => {
            if (ans === quizData[idx].answer) correctCount++;
        });

        const scorePercentage = Math.round((correctCount / quizData.length) * 100);

        scoreNum.textContent = scorePercentage;
        scoreCircle.style.background = `conic-gradient(var(--accent-color) ${scorePercentage * 3.6}deg, var(--border-color) 0deg)`;

        if (scorePercentage >= 90) {
            resultTitle.textContent = '완벽합니다! 🏆';
            resultMsg.textContent = '강의 자료를 매우 깊이 있게 이해하고 계시네요.';
        } else if (scorePercentage >= 70) {
            resultTitle.textContent = '훌륭한 성적입니다! 👏';
            resultMsg.textContent = '백제 미술과 원삼국 시대의 핵심 개념을 잘 파악하고 있습니다.';
        } else {
            resultTitle.textContent = '조금 더 복습해볼까요? 📚';
            resultMsg.textContent = '아래 오답 노트를 통해 틀린 문제를 점검해보세요.';
        }

        reviewList.innerHTML = '';
        quizData.forEach((q, idx) => {
            const userAns = userAnswers[idx];
            const isCorrect = (userAns === q.answer);

            const reviewItem = document.createElement('div');
            reviewItem.className = 'review-item';
            reviewItem.innerHTML = `
                <div class="review-q">${idx + 1}. ${q.question}</div>
                <div class="review-ans ${isCorrect ? 'correct-is' : 'user-wrong'}">
                    ${isCorrect ? '✓ ' : '✗ '} 나의 제출: ${userAns !== null ? q.options[userAns] : '미응답'}
                </div>
                ${!isCorrect ? `<div class="review-ans correct-is">✓ 정답: ${q.options[q.answer]}</div>` : ''}
                <div class="review-exp">${q.rationale}</div>
            `;
            reviewList.appendChild(reviewItem);
        });

        window.scrollTo(0, 0);
    }

    function restartQuiz() {
        headerSubTitle.textContent = '철기·원삼국 & 백제 미술';
        startQuiz();
    }
</script>

</body>
</html>
